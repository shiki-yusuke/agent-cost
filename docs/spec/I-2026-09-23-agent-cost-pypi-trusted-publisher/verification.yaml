success_criteria_matrix:
  - criterion: "tag push だけが publish を起動する: release workflow のトリガーは v<version> 形式の
      tag push と workflow_dispatch の 2 つだけで、main への push や pull_request
      では起動しない。tag push では tag の version と pyproject.toml の version の一致を検証してから
      sdist + wheel を build し、twine check --strict を通し、PyPI の Trusted
      Publisher（OIDC）で公開する。否定側: tag と version が不一致なら build job が fail して publish
      job に到達しない（TEST-01）。workflow_dispatch では publish job と github-release job
      が skipped になる（TEST-06、TEST-08）"
    covered_by: test
    evidence: release.yml の on / if / needs（lint (e)(f)
      で固定、test_02_real_workflow_passes_lint）、test_01_*、test_08_*
    negation_test: test_01_version_mismatch_exits_1、test_08_publish_if_must_be_tag_only（if
      欠落 fixture で lint exit 1）
  - criterion: "長期トークンを参照しない: release.yml は secrets.GITHUB_TOKEN 以外の secrets
      を参照せず、password 入力や TWINE_PASSWORD / TWINE_USERNAME / PYPI_API_TOKEN
      系の環境変数を持たず、id-token: write は publish job にだけ付く。repo secrets に PyPI 系の
      secret が存在しないことを gh secret list で確認する（人間 gate、2026-09-23 時点で 0 件）。否定側:
      workflow-lint は改変 fixture（secrets.PYPI_API_TOKEN を足したもの）で exit 1
      になる（TEST-02）"
    covered_by: test
    evidence: test_02_real_workflow_passes_lint、manual_verification TEST-10（gh
      secret list 0 件）
    negation_test: test_02_mutated_workflow_fails_lint[secrets.PYPI_API_TOKEN /
      with.password / env.TWINE_PASSWORD / id-token on build]
  - criterion: "公開物の三者一致: publish した sdist と wheel、その sha256 一覧（SHA256SUMS）が同じ tag の
      GitHub Release に添付され、(a) Release assets のファイル名集合が『SHA256SUMS に列挙された配布物 +
      SHA256SUMS 自体』と完全一致（余剰も欠落も不可）、(b) 各配布物 asset の sha256 が SHA256SUMS と一致、(c)
      PyPI JSON API の digests.sha256 が SHA256SUMS と filename 集合ごと完全一致する。否定側:
      verify-pypi は欠落・余剰・不一致・重複行・不正 digest・HTTP 失敗のいずれでも exit
      1（TEST-03）。docs/release.md に不一致時の対応（yank と patch version での再リリース）がある"
    covered_by: test
    evidence: test_03_three_way_match_exits_0、release.yml github-release job（3
      assets を --clobber で添付）、docs/release.md Recovery 節
    negation_test: test_03_pypi_missing_file_exits_1 /
      test_03_pypi_extra_file_exits_1 / test_03_pypi_digest_mismatch_exits_1 /
      test_03_duplicate_sums_line_exits_1 / test_03_malformed_digest_exits_1 /
      test_03_pypi_unavailable_exits_1 / test_03_assets_extra_file_exits_1 ほか
  - criterion: "手順書: docs/release.md に version bump → CHANGELOG → PR merge → tag
      push → workflow 結果確認 → verify-pypi → 失敗時の回復（build 失敗は修正して新 tag、PyPI 公開後の
      Release 添付失敗は失敗 job のみ再実行または検証済み artifact の手動添付、同 tag の全 job 再実行と tag
      の再利用は禁止）を記載する。README は pip install と docs/release.md へのリンクのみ。否定側: TEST-04
      は docs / README に ~/.pypirc または twine upload が手順として現れると exit 1（改変 fixture
      で確認）"
    covered_by: test
    evidence: docs/release.md（Releasing / Recovery 節）、README.md の 1
      行、test_04_real_docs_pass、test_09_recovery_wording_required
    negation_test: test_04_twine_upload_as_procedure_fails /
      test_04_readme_twine_procedure_fails / test_09_recovery_wording_required[4
      文言]
  - criterion: "無退行: .github/workflows/ci.yml は 1 バイトも変更しない（forbidden_paths）。否定側:
      TEST-05 = git diff main -- .github/workflows/ci.yml が空でなければ fail（1
      行変えた作業ツリーで非空になることを 1 回確認して記録し、元に戻す）"
    covered_by: manual
    evidence: manual_verification TEST-05-negation（2026-09-23、diff 空 → 1 行追記で非空 → 復元で空）
    negation_test: 同上（1 行追記で非空を実測）
  - criterion: "実走確認: (a) workflow_dispatch でのドライラン（workflow-lint + build + twine
      check、publish 無し）が green で publish / github-release が skipped（TEST-06）。(b)
      次の実リリース（tag push は人間）で PyPI 公開・Release assets 3 件・三者一致（TEST-07）を人間が確認し
      manual_verification に記録する。(b) までは 5_done にしない"
    covered_by: manual
    evidence: manual_verification TEST-06 / TEST-07（pending。PR merge と PyPI
      登録の後に人間が実施）、goal_stopping_condition に 5_done 条件を明記
    negation_test: TEST-08（dispatch で publish が走る構成は lint が拒否）。実走の否定側は TEST-07 の
      verify-pypi exit 1 経路
cross_check_intent_vs_spec:
  performed_at: 2026-09-23 (Phase 3)
  finding: intent.success 6 行 ↔ matrix 6 行を行順で 1 対 1 突合、過不足なし。spec v3 が intent
    より強い条件を置いた箇所 = RULE-13（GH_TOKEN の供給元限定）と RULE-12（pyyaml / pytest の pin）。いずれも
    success 2 / success 1 の「長期トークン不参照」「build の再現性」を実装レベルで具体化したもので、intent
    の記述より弱くはない。intent の success 2 は「PYPI_API_TOKEN 系」と書き、実装は PYPI_TOKEN /
    UV_PUBLISH_TOKEN も禁止する（強い側）。intent は書き換えない

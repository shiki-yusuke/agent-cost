schema_version: "1.0"
intent_id: I-2026-09-23-agent-cost-pypi-trusted-publisher
test_matrix:
  - ears_rule: RULE-03
    test_type: unit
    test_name: test_01_version_matches_real_pyproject /
      test_01_version_mismatch_exits_1 / test_01_version_tag_without_v_exits_1
    status: added
    note: TEST-01。.github/scripts/test_release_checks.py。期待値は RULE-03（tag と
      pyproject の完全一致、v 接頭）から導出
  - ears_rule: RULE-02, RULE-04, RULE-05, RULE-06, RULE-13
    test_type: unit
    test_name: test_02_real_workflow_passes_lint /
      test_02_mutated_workflow_fails_lint[28 fixtures] /
      test_02_release_job_if_alone_cannot_be_loosened（単独 1 件）
    status: added
    note: TEST-02。正側 = 実 release.yml が exit 0。否定側 = spec §5.2 TEST-02 の fixture 28
      件（secrets index 構文・toJSON(secrets)・write-all・余分な job・reusable
      workflow・needs 拡張・別 action 名 + 同 SHA・attestations false・artifact 改名・on の
      list 形・true キーによる on 偽装 を含む）+ github-release の if 単独改変
  - ears_rule: RULE-02
    test_type: unit
    test_name: test_08_publish_if_must_be_tag_only[4 fixtures]
    status: added
    note: TEST-08。tag 条件の削除 / `|| true` / refs/tags/ への緩和 / if 欠落 のいずれも lint が拒否
  - ears_rule: RULE-07
    test_type: unit
    test_name: test_03_* (14 tests)
    status: added
    note: TEST-03。HTTP は --pypi-json で注入。三者一致 exit 0、PyPI 欠落 / 余剰 / digest 不一致 / 重複行
      / 不正 digest / 空 SUMS / 取得不能 / JSON 不正 / urls 無し / assets 欠落 / 余剰 / sha 不一致
      / SUMS 自体欠落 は exit 1
  - ears_rule: RULE-10, RULE-11
    test_type: unit
    test_name: test_04_real_docs_pass / test_04_twine_upload_as_procedure_fails /
      test_04_readme_twine_procedure_fails /
      test_09_recovery_wording_required[4]
    status: added
    note: TEST-04 / TEST-09。docs/release.md と README.md。旧経路を手順として書くと exit
      1、回復文言（Re-run failed jobs / git tag -f / all jobs / Reusing a tag）が欠けると
      exit 1
  - ears_rule: RULE-09
    test_type: regression
    test_name: git diff --quiet main -- .github/workflows/ci.yml
    status: added
    note: TEST-05。2026-09-23 に diff 空を確認。否定側は 1 行追記で非空になることを確認して復元（下の
      manual_verification）
  - ears_rule: RULE-12, RULE-08
    test_type: manual
    test_name: release.yml の pin 行（build==1.6.1 twine==7.0.0 pyyaml==6.0.3
      pytest==9.1.1、action 5 本の SHA、attestations 無指定）
    status: added
    note: レビューで逐条確認。attestations 既定 true は pin SHA の action.yml で確認（spec D7）
  - ears_rule: RULE-01
    test_type: manual
    test_name: TEST-07 次の実リリース（tag push → publish → Release assets 3 件 → verify-pypi
      --assets-dir exit 0）
    status: tbd
    note: 実走でしか観測できない。人間が実施し manual_verification に記録するまで 5_done にしない
test_gaps:
  - taxonomy: test_missing
    description: RULE-02（workflow_dispatch で publish / github-release が
      skipped）は実走（TEST-06）でしか確認できない。静的には TEST-08 で if の完全一致を固定済み。PR merge 後に人間が
      Actions から手動実行し skipped を確認して manual_verification TEST-06 に追記する
    location: .github/workflows/release.yml
    priority: medium
  - taxonomy: test_missing
    description: RULE-01 / RULE-05 / RULE-08（実 publish、artifact 受け渡し、attestations
      既定）は PyPI 側の Trusted Publisher 登録（人間、D6）後の実リリースでのみ観測できる。TEST-07
      を次の実リリースで実施し、5_done はそれまで保留
    location: .github/workflows/release.yml
    priority: high
manual_verification:
  - id: TEST-05-negation
    description: "ci.yml 無退行の否定側: ci.yml に 1 行追記して git diff main --
      .github/workflows/ci.yml が非空になることを確認し、復元後に空へ戻ることを確認する"
    expected_status: done 2026-09-23（非空 → 復元で空。実 diff は空のまま）
  - id: TEST-10
    description: repo secrets に PyPI 系（PYPI* / TWINE*）の名前が無いことを gh secret list -R
      shiki-yusuke/agent-cost で確認する（RULE-04 の人間 gate）
    expected_status: done 2026-09-23（0 件）
  - id: local-checks
    description: 手元で python -m pytest -q
      .github/scripts、workflow-lint、docs-lint、version --tag v0.2.1、既存 tests
      を実行する
    expected_status: done 2026-09-23（58 passed / lint ok / docs ok / version ok / 241 passed）
  - id: TEST-06
    description: PR merge 後、Actions から release workflow を workflow_dispatch
      で実行し、build が green、publish と github-release が skipped であることを run URL
      とともに記録する
    expected_status: pending（PR merge 後、人間）
  - id: TEST-07
    description: 次の実リリース（tag push は人間）で publish 成功・Release assets 3 件・verify-pypi
      --assets-dir exit 0 を記録する。これが済むまで 5_done にしない
    expected_status: pending（次の実リリース、人間）
goal_stopping_condition:
  - success_criteria_matrix 全行が covered_by none 以外
  - TEST-06 と TEST-07 が manual_verification に記録されるまで lane を 5_done にしない

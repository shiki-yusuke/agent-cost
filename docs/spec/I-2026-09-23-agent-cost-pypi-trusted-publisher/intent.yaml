schema_version: "1.0"
intent_id: I-2026-09-23-agent-cost-pypi-trusted-publisher
execution_mode: manual
budget: []
intent:
  business_goal: coding-agent-cost の PyPI publish を、手元の twine + 長期 API
    トークン（~/.pypirc）から GitHub Actions の Trusted Publisher（OIDC、短命トークン、PyPI 側で
    owner/repo/workflow/environment を登録）に切り替える。トークン失効による publish 停止（2026-09-16 と
    2026-09-23 の 2 回、いずれも 403）を再発させない。tag push を人間が行うことを唯一の publish トリガーとし、build
    は CI 上で再現可能（Python 版固定、sdist + wheel、twine check）にし、公開した配布物の sha256 を
    Release に残す
  user_visible_intent: メンテナが v<version> の tag を push すると、GitHub Actions が sdist と
    wheel を build・検証し、PyPI に公開し、同じ配布物と sha256 を GitHub Release
    に添付する。手元にトークンを置く必要が無くなり、トークン失効で publish が止まらない。tag を push しない限り何も公開されない
  success:
    - "tag push だけが publish を起動する: release workflow のトリガーは v<version> 形式の tag push と workflow_dispatch の 2 つだけで、main への push や pull_request では起動しない。tag push では tag の version と pyproject.toml の version の一致を検証してから sdist + wheel を build し、twine check --strict を通し、PyPI の Trusted Publisher（OIDC）で公開する。否定側: tag と version が不一致なら build job が fail して publish job に到達しない（TEST-01）。workflow_dispatch では publish job と github-release job が skipped になる（TEST-06、TEST-08）"
    - "長期トークンを参照しない: release.yml は secrets.GITHUB_TOKEN 以外の secrets を参照せず、password 入力や TWINE_PASSWORD / TWINE_USERNAME / PYPI_API_TOKEN 系の環境変数を持たず、id-token: write は publish job にだけ付く。repo secrets に PyPI 系の secret が存在しないことを gh secret list で確認する（人間 gate、2026-09-23 時点で 0 件）。否定側: workflow-lint は改変 fixture（secrets.PYPI_API_TOKEN を足したもの）で exit 1 になる（TEST-02）"
    - "公開物の三者一致: publish した sdist と wheel、その sha256 一覧（SHA256SUMS）が同じ tag の GitHub Release に添付され、(a) Release assets のファイル名集合が『SHA256SUMS に列挙された配布物 + SHA256SUMS 自体』と完全一致（余剰も欠落も不可）、(b) 各配布物 asset の sha256 が SHA256SUMS と一致、(c) PyPI JSON API の digests.sha256 が SHA256SUMS と filename 集合ごと完全一致する。否定側: verify-pypi は欠落・余剰・不一致・重複行・不正 digest・HTTP 失敗のいずれでも exit 1（TEST-03）。docs/release.md に不一致時の対応（yank と patch version での再リリース）がある"
    - "手順書: docs/release.md に version bump → CHANGELOG → PR merge → tag push → workflow 結果確認 → verify-pypi → 失敗時の回復（build 失敗は修正して新 tag、PyPI 公開後の Release 添付失敗は失敗 job のみ再実行または検証済み artifact の手動添付、同 tag の全 job 再実行と tag の再利用は禁止）を記載する。README は pip install と docs/release.md へのリンクのみ。否定側: TEST-04 は docs / README に ~/.pypirc または twine upload が手順として現れると exit 1（改変 fixture で確認）"
    - "無退行: .github/workflows/ci.yml は 1 バイトも変更しない（forbidden_paths）。否定側: TEST-05 = git diff main -- .github/workflows/ci.yml が空でなければ fail（1 行変えた作業ツリーで非空になることを 1 回確認して記録し、元に戻す）"
    - "実走確認: (a) workflow_dispatch でのドライラン（workflow-lint + build + twine check、publish 無し）が green で publish / github-release が skipped（TEST-06）。(b) 次の実リリース（tag push は人間）で PyPI 公開・Release assets 3 件・三者一致（TEST-07）を人間が確認し manual_verification に記録する。(b) までは 5_done にしない"
  non_goal:
    - "version bump と CHANGELOG の自動生成（引き続き人間が commit する）"
    - "spec-lane（npm）側の publish 経路の変更"
    - "release-evidence / evidence-docs への配布物ハッシュの取り込み（本 lane は GitHub Release への添付まで）"
    - "TestPyPI への並行 publish（必要なら follow-up。本 lane のドライランは publish を含まない）"
    - "既存 ci.yml の改修（test matrix、smoke の内容）"
    - "GitHub environment pypi への保護ルール（required reviewers 等）の設定。人間が後から Web で足せる"
  constraints:
    - "release workflow のトリガーは v* の tag push と workflow_dispatch のみ（main push / pull_request では起動しない）。publish job と github-release job は if で tag event（push かつ refs/tags/v で始まる）に限定する"
    - "GitHub environment pypi を publish job に付け、PyPI 側の Trusted Publisher 登録（owner shiki-yusuke / repo agent-cost / workflow release.yml / environment pypi）は人間が Web で行う。登録前に tag を push しても publish は認証エラーで fail するだけで他への影響は無い"
    - "permissions は job 単位で最小化: 既定 contents: read、publish job のみ id-token: write、Release 添付 job のみ contents: write"
    - "third-party action（actions/checkout, actions/setup-python, actions/upload-artifact, actions/download-artifact, pypa/gh-action-pypi-publish）は commit SHA で pin し、行末コメントに対応 version tag を残す。GitHub Release の作成と添付は runner 同梱の gh CLI で行い action を増やさない。既存 ci.yml の @v4 / @v5 は触らない"
    - "build は Python 3.12（ci.yml の package job と同じ）で python -m build、twine check --strict。Sigstore attestations は pypa action の既定に従い、明示的に無効化しない"
    - "publish job は build job の成果物（upload-artifact 経由）だけを対象にし、publish job 内で再 build しない。Release 添付 job も同じ成果物を使う"
    - "pyproject.toml / agent_cost/** / tests/** は変更しない。version は tag と一致検証するだけで書き換えない"
    - "PyPI トークンを新たに発行・登録しない。~/.pypirc の削除は人間の判断（docs に『不要になった』と書くまで）"
    - "静的検査スクリプトとそのテストは .github/scripts/ に置く（allowed_paths に含める）。tests/ には足さない"
  primary_user: agent-cost のメンテナ（リリース担当）
  state_segments: []
  known_affected_behavior:
    - "手元の twine + ~/.pypirc でのリリース手順が無効になる（README / docs の記述が変わる）"
    - "release/ ディレクトリに手元で sha256 記録を残す運用（0.2.0 で実施）は GitHub Release の SHA256SUMS 添付に置き換わる"
    - "GitHub Release に assets（sdist / wheel / SHA256SUMS）が付くようになる（0.2.1 までは assets 0）。Release が tag 時点で無ければ workflow が作成する"
  declared_risk: medium
ai_inferred_scope:
  affected_layers:
    - ci
    - release
    - docs
  related_files:
    - .github/workflows/ci.yml
    - pyproject.toml
    - README.md
  required_docs: []
  confidence: medium
  open_questions: []
  allowed_paths:
    - .github/workflows/release.yml
    - .github/scripts/**
    - docs/release.md
    - README.md
    - docs/spec/I-2026-09-23-agent-cost-pypi-trusted-publisher/**
  forbidden_paths:
    - agent_cost/**
    - tests/**
    - pyproject.toml
    - rates.json
    - docs/claims/**
    - docs/spec/I-2026-08-15-*/**
    - .github/workflows/ci.yml

premise_evidence:
  required: true
  method: data
  reproduced: true
  evidence: "症状は直接観測済み（AI 起点ではない）。~/ai_bus/tasks.md の記録: (1) 2026-09-16 oss-space-45: coding-agent-cost 0.2.0 の twine upload が旧トークンで 403 → ユーザーが新トークンを発行して再実行し公開（LOG 行『PyPI 旧トークン無効 403』）。(2) 2026-09-23 oss-space-a2: 0.2.1 の twine upload が 403（トークン失効）→ ユーザーが project-scoped トークンを再発行し ~/.pypirc を更新 → oss-space-8a が再実行して公開（tasks.md『coding-agent-cost 0.2.1 PyPI publish 完了』、sha256 記録あり）。現状の経路依存を 2026-09-23 に repo で確認: .github/workflows は ci.yml のみ（release / publish workflow 無し）、publish は手元の python3 -m twine と ~/.pypirc（存在のみ確認、内容は読まない）に依存、GitHub Release v0.2.0 / v0.2.1 は assets 0、repo environments は copilot のみ（pypi 無し）。PyPI 側に Trusted Publisher が未登録であることは Web 設定のため CLI から確認できず、人間が登録時に『未登録』を確認する（留保）"

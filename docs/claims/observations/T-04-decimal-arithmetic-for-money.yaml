  - observation_id: OBS-013
    topic_id: T-04
    claim_kind: behavior
    statement: >-
      price_fact()'s cost/credit formula ((tokens / 1_000_000) * rate *
      fast_multiplier) is computed entirely in Decimal arithmetic,
      including the fast-mode multiplier; tests assert the exact resulting
      Decimal value (e.g. Decimal("5.0") * Decimal("2.5")), not an
      approximately-equal float comparison, which would not distinguish
      Decimal arithmetic from float arithmetic that happened to round to
      the same displayed value.
    origin: reconstructed
    epistemic_status: execution_verified
    review_status: unreviewed
    conformance_status: matched
    subject_refs:

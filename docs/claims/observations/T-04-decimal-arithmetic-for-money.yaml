  - observation_id: OBS-012
    topic_id: T-04
    claim_kind: constraint
    statement: >-
      Every numeric rate field in rates.json (input_nocache, cache_read,
      cache_write_5m, cache_write_1h, output, fast_multiplier,
      credits_per_mtok.*, usd_per_credit) is parsed via _parse_decimal into
      a decimal.Decimal, never a Python float; _parse_decimal also rejects
      any value that parses to a negative Decimal, regardless of which
      field it came from.
    origin: reconstructed
    epistemic_status: execution_verified
    review_status: unreviewed
    conformance_status: matched
    subject_refs:

  - observation_id: OBS-014
    topic_id: T-04
    claim_kind: decision_record
    statement: >-
      rows_totals() deliberately sums each row's Decimal
      estimated_cost_usd/credits fields first and converts to float exactly
      once at the end, rather than summing already-float-converted
      per-row values, specifically so that precision is not lost across
      many small rows before the final conversion -- stated directly in the
      function's own docstring as the reason for that ordering.
    origin: recorded
    epistemic_status: recorded_decision
    review_status: unreviewed
    conformance_status: matched
    subject_refs:

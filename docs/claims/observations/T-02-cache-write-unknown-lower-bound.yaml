  - observation_id: OBS-006
    topic_id: T-02
    claim_kind: decision_record
    statement: >-
      Pricing an unknown-TTL cache write at the 5-minute rate as an
      explicit lower bound -- instead of guessing the more expensive
      1-hour rate, or averaging the two -- is a deliberate design decision,
      recorded in both price_fact's own docstring and the README's "What
      this measures" section, so a reader of the output number knows it is
      a floor, not a best-effort midpoint.
    origin: recorded
    epistemic_status: recorded_decision
    review_status: unreviewed
    conformance_status: matched

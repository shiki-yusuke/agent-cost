  - observation_id: OBS-007
    topic_id: T-02
    claim_kind: behavior
    statement: >-
      The Codex CLI reader (parse_rollout_facts) never emits a
      cache_write_5m, cache_write_1h, or cache_write_unknown fact for any
      event -- it only ever constructs Fact objects with token_kind
      "input_nocache", "cache_read", or "output". This matches the README's
      claim that Codex exposes no cache-write signal at all, but is
      recorded here from a direct, single-pass static read of the reader
      module rather than from a test that asserts the negative (no test in
      tests/test_reader_codex.py checks that "cache_write" never appears
      in a fact's token_kind).
    origin: reconstructed
    epistemic_status: single_source_observation
    review_status: unreviewed
    conformance_status: matched
    subject_refs:
      - parse_rollout_facts

topic_id: T-02
observations:
  - observation_id: OBS-004
    topic_id: T-02
    claim_kind: behavior
    statement: >-
      parse_session_facts emits cache_write_5m/cache_write_1h facts when a
      Claude Code event's usage.cache_creation dict is present and its two
      ephemeral counters sum to the event's cache_creation_input_tokens
      exactly; when usage.cache_creation is absent entirely, the whole
      cache_creation_input_tokens count is instead emitted as a single
      cache_write_unknown fact. (The tested cases only cover a full TTL
      breakdown that exactly accounts for the total, and no breakdown at
      all -- see this topic's gap record for the partial-breakdown case the
      code also handles but no test exercises.)
    origin: reconstructed
    epistemic_status: execution_verified
    review_status: unreviewed
    conformance_status: matched
    subject_refs:
      - parse_session_facts
    provenance:

  - observation_id: OBS-005
    topic_id: T-02
    claim_kind: behavior
    statement: >-
      price_fact() prices a cache_write_unknown fact by substituting the
      cache_write_5m rate field (never cache_write_1h, the more expensive
      one) and setting pricing_status to "lower_bound" rather than
      "priced", so a caller can tell "priced normally" apart from "priced
      as an explicit floor because the TTL was unknown".
    origin: reconstructed
    epistemic_status: execution_verified
    review_status: unreviewed
    conformance_status: matched

  - observation_id: OBS-010
    topic_id: T-03
    claim_kind: invariant
    statement: >-
      build_rows()'s row.pricing_status ranking is defined in code as a
      full three-way order -- unpriced (rank 0) beats lower_bound (rank 1)
      beats priced (rank 2), via _STATUS_RANK -- so a row containing both a
      lower_bound fact and a plain priced fact should end up "lower_bound",
      not "priced". Only the unpriced-over-priced half of this ordering is
      exercised by an existing test
      (test_build_rows_mixed_priced_and_unpriced_marks_row_unpriced); no
      test in tests/test_aggregate.py builds a row from a mix of a
      lower_bound fact and a priced fact, so the lower_bound-vs-priced half
      of the ranking is confirmed only by reading _STATUS_RANK and
      build_rows() directly, not by execution.
    origin: reconstructed
    epistemic_status: single_source_observation
    review_status: unreviewed
    conformance_status: matched
    subject_refs:
      - build_rows
      - _STATUS_RANK
    provenance:
      - source_kind: source
        uri: agent_cost/aggregate.py
        selector: _STATUS_RANK
        content_digest: "a2d26673aa9122f441c92c4d1fe7662bfa6dceda98a862ae7136114f45a8cb8c"

  - observation_id: OBS-008
    topic_id: T-03
    claim_kind: behavior
    statement: >-
      price_fact() returns (None, "unpriced", None) -- never a guessed
      number -- both when the fact's model_key does not resolve against the
      catalog at all, and when the model resolves but the specific
      token-kind rate field for the covering rate period is None (e.g.
      OpenAI models carry no cache_write_5m rate at all, so a cache-write
      fact against gpt-5.5 is unpriced even though the model itself is
      known).
    origin: reconstructed
    epistemic_status: execution_verified
    review_status: unreviewed
    conformance_status: matched
    subject_refs:

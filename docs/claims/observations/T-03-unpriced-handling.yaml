  - observation_id: OBS-009
    topic_id: T-03
    claim_kind: behavior
    statement: >-
      build_rows() marks an entire grouped row "unpriced" as soon as any one
      of the facts folded into that bucket is unpriced, even if other facts
      in the same bucket priced normally -- a row is never reported as
      fully priced when part of its token count actually wasn't.
    origin: reconstructed
    epistemic_status: execution_verified
    review_status: unreviewed
    conformance_status: matched
    subject_refs:

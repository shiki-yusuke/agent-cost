      agent-cost's own hand-written structural checker
      (check_measure_payload in tests/test_measure_v1_contract.py) agrees
      with the vendored contract's own accept/reject labels: all 3 vendored
      "accept" fixtures pass it with zero issues, and all 6 vendored
      "reject" fixtures produce at least one issue (with the expected
      reason code where one is asserted, e.g. protocol_version mismatch,
      a matched:false session entry with non-zero totals, or
      total.rows disagreeing with the sessions-level re-aggregation).

    statement: >-
      measure/v1's version number, prose contract, and implementation are
      owned end-to-end by agent-cost (agent_cost/cli.py's
      MEASURE_PROTOCOL_VERSION constant and cmd_measure), while the JSON
      Schema single source of truth and its conformance fixtures live in a
      different repository, ai-agent-skills-playbook
      (contracts/measure/v1/measure-output.schema.json), and are vendored
      byte-for-byte, read-only, into agent-cost's own test tree at a pinned
      commit (tests/fixtures/measure-v1-contract/, per its own UPSTREAM
      pin file) -- this repo never edits the playbook's doc or vice versa.

  - observation_id: OBS-003
    topic_id: T-01
    claim_kind: invariant
    statement: >-
      Two rate periods for the same model are rejected as "overlapping" if
      one's effective_until (or an open-ended period's implicit
      datetime.max) is strictly after the next one's effective_from; a
      period ending exactly when the next one begins (touching, not
      overlapping) is accepted. Periods are sorted by effective_from before
      this adjacent-pair check runs.
    origin: reconstructed
    epistemic_status: execution_verified
    review_status: unreviewed
    conformance_status: matched
    subject_refs:
      - _build_model_entry

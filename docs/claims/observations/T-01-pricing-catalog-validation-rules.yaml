observations:
  - observation_id: OBS-001
    topic_id: T-01
    claim_kind: constraint
    statement: >-
      load_rates() rejects a catalog outright (raising RatesValidationError)
      if schema_version is not "1", currency is not "USD", or unit is not
      "per_mtok" -- these are closed allow-lists (SUPPORTED_SCHEMA_VERSIONS /
      SUPPORTED_CURRENCIES / SUPPORTED_UNITS), not warnings, so a catalog in
      an unexpected unit/currency can never be silently priced as if it were
      USD-per-mtok.
    origin: reconstructed
    epistemic_status: execution_verified
    review_status: unreviewed
    conformance_status: matched
    subject_refs:
      - load_rates
      - _validate_and_build
    provenance:

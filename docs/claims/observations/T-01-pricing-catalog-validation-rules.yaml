  - observation_id: OBS-002
    topic_id: T-01
    claim_kind: invariant
    statement: >-
      A catalog is rejected at load time if two models share the same
      model_key, if one model's alias equals another model's own model_key
      (alias/model_key namespaces cannot collide), or if the same alias
      string is registered under two different models -- all three are
      structural invariants of _build_model_entry/_validate_and_build's
      alias_index construction, not just a documentation convention.
    origin: reconstructed
    epistemic_status: execution_verified
    review_status: unreviewed
    conformance_status: matched
    subject_refs:
      - load_rates
      - _validate_and_build
    provenance:

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent-cost"
version = "0.1.1"
description = "Estimate AI coding agent (Claude Code / Codex CLI) token usage and cost from local logs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "shiki-yusuke" },
]
keywords = [
    "ai-agents",
    "claude-code",
    "codex-cli",
    "cost-estimation",
    "local-first",
    "token-usage",
]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/shiki-yusuke/agent-cost"
Repository = "https://github.com/shiki-yusuke/agent-cost"
Issues = "https://github.com/shiki-yusuke/agent-cost/issues"

[project.scripts]
agent-cost = "agent_cost.cli:main"

[tool.setuptools.packages.find]
include = ["agent_cost*"]

[tool.setuptools.package-data]
agent_cost = ["rates.json"]
